<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CRVT Prototype</title>
    <style>
      :root {
        --blue: #2448ea;
        --text: #0e3b96;
        --bg: #efefef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        font-family: Arial, sans-serif;
        color: var(--text);
      }
      .app {
        display: grid;
        grid-template-columns: 150px 1fr 460px;
        gap: 24px;
        padding: 24px;
        max-width: 1600px;
        margin: auto;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .cat {
        height: 150px;
        border-radius: 24px;
        padding: 16px;
        background: linear-gradient(135deg, #dfe5ff, #bcc9ff, #dfe5ff);
        position: relative;
        cursor: pointer;
      }
      .cat.active {
        background: var(--blue);
        color: #fff;
      }
      .go {
        position: absolute;
        right: -8px;
        top: 10px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--blue);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .titleRow {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .titleRow h2,
      .benefits h2 {
        margin: 0;
        color: #123c99;
      }
      .line {
        height: 1px;
        background: #5b7edc;
        flex: 1;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 18px;
      }
      .card {
        background: #fff;
        border-radius: 18px;
        padding: 14px;
        min-height: 245px;
        position: relative;
      }
      .card h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      .card p {
        font-size: 13px;
        line-height: 1.5;
      }
      .dur {
        position: absolute;
        left: 14px;
        bottom: 12px;
        font-weight: bold;
      }
      .arrow {
        position: absolute;
        right: -10px;
        bottom: -10px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--blue);
        color: #fff;
        border: none;
      }
      .benefitGrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .benefit {
        background: linear-gradient(135deg, #dfe5ff, #c8d3ff, #dfe5ff);
        height: 136px;
        border-radius: 18px;
        padding: 14px;
        position: relative;
        cursor: pointer;
      }
      .benefit.active {
        background: var(--blue);
        color: #fff;
      }
      .benefit .b {
        position: absolute;
        left: -8px;
        bottom: -8px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--blue);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .detail {
        background: #fff;
        border-radius: 18px;
        padding: 20px;
        min-height: 700px;
      }
      .top {
        display: flex;
        justify-content: space-between;
      }
      .back {
        border: none;
        padding: 10px 18px;
        border-radius: 22px;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(6px);
        align-items: center;
        justify-content: center;
      }
      .modal.show {
        display: flex;
      }
      .panel {
        background: #fff;
        width: 520px;
        border-radius: 18px;
        padding: 20px;
      }
      .item {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 12px;
        margin: 10px 0;
        display: flex;
        justify-content: space-between;
      }
      .icon {
        font-size: 34px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="sidebar" id="nav"></div>
      <div>
        <div class="titleRow">
          <h2 id="heading">One-off Volunteering</h2>
          <div class="line"></div>
          <button class="back" onclick="home()">Back</button>
        </div>
        <div id="view"></div>
      </div>
      <div class="benefits">
        <div class="titleRow">
          <h2>Benefits</h2>
          <div class="line"></div>
        </div>
        <div class="benefitGrid" id="benefits"></div>
      </div>
    </div>
    <div class="modal" id="modal">
      <div class="panel">
        <h3 id="mt"></h3>
        <div id="ml"></div>
      </div>
    </div>
    <script>
      const cats = [
        { n: 'One-off Volunteering', i: '👍' },
        { n: 'On-going Opportunities', i: '⚙️' },
        { n: 'Home Based Working', i: '👤' },
        { n: 'Own Choice Volunteering', i: '✅' },
      ];
      const opps = [
        {
          id: 1,
          c: 0,
          t: 'Sharing Your Career Journey',
          d: 'Sharing experience with students and communities.',
          dur: '30 minutes',
          b: [
            'Short Commitment',
            'Build Professional Networks',
            'Reflection and Growth',
          ],
        },
        {
          id: 2,
          c: 0,
          t: 'Young Enterprise',
          d: 'Support students through enterprise activities.',
          dur: '2-3 hours',
          b: ['Develop Leadership Skills'],
        },
        {
          id: 3,
          c: 1,
          t: 'Action Tutoring',
          d: 'Tutor disadvantaged pupils.',
          dur: '2-3 hours',
          b: ['Educational Impact'],
        },
        {
          id: 4,
          c: 2,
          t: 'Become a Reading Volunteer',
          d: 'Virtual reading support.',
          dur: '30 minutes',
          b: ['Educational Impact'],
        },
      ];
      const benefits = [
        'Short Commitment',
        'Develop Leadership Skills',
        'Improved Communication & Collaboration',
        'Accelerate Personal & Professional Growth',
        'Strengthen Strategic Thinking',
        'Build Professional Networks',
        'Increase Confidence & Credibility',
        'Educational Impact',
        'Reflection and Growth',
        'Leadership Development',
        'Enhanced Skills',
      ];
      let activeCat = 0;
      function render() {
        nav.innerHTML = cats
          .map(
            (c, i) =>
              `<div class='cat ${
                i === activeCat ? 'active' : ''
              }' onclick='cat(${i})'><div class=icon>${c.i}</div><h3>${
                c.n
              }</h3><div class=go>→</div></div>`
          )
          .join('');
        benefitsEl = document.getElementById('benefits');
        benefitsEl.innerHTML = benefits
          .map(
            (b) =>
              `<div class='benefit' onclick='showBenefit("${b}")'>${b}<div class=b>←</div></div>`
          )
          .join('');
        home();
      }
      function home() {
        heading.innerText = cats[activeCat].n;
        view.innerHTML = `<div class=cards>${opps
          .filter((x) => x.c === activeCat)
          .map(
            (o) =>
              `<div class=card><h3>${o.t}</h3><p>${o.d}</p><div class=dur>${o.dur}</div><button class=arrow onclick='event.stopPropagation();detail(${o.id})'>→</button></div>`
          )
          .join('')}</div>`;
      }
      function cat(i) {
        activeCat = i;
        render();
      }
      function detail(id) {
        let o = opps.find((x) => x.id === id);
        view.innerHTML = `<div class=detail><div class=top><h2>${o.t}</h2><h2>${
          o.dur
        }</h2></div><p>${o.d}</p><h3>Benefits</h3>${o.b
          .map((x) => '<p>• ' + x + '</p>')
          .join(
            ''
          )}<div style="position:absolute"></div><button style="margin-top:40px;background:#2448ea;color:#fff;border:none;padding:12px 18px;border-radius:24px">Enquire now →</button></div>`;
      }
      function showBenefit(name) {
        let m = opps.filter((o) => o.b.includes(name));
        mt.innerText = name;
        ml.innerHTML = m
          .map(
            (o) =>
              `<div class=item><div>${o.t}</div><button onclick='detail(${o.id});modal.classList.remove("show")'>→</button></div>`
          )
          .join('');
        modal.classList.add('show');
      }
      modal.onclick = (e) => {
        if (e.target.id === 'modal') modal.classList.remove('show');
      };
      render();
    </script>
  </body>
</html>
